name: One-time branch cleanup
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove-other-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" != "main" ]]; then
              echo "Deleting $branch"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$branch"
            fi
          done
          remaining=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --paginate --jq '.[].name' | grep -v '^main$' || true)
          if [[ -n "$remaining" ]]; then
            echo "Branches still remaining: $remaining"
            exit 1
          fi
      - name: Remove one-time cleanup workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/one-time-branch-cleanup.yml?ref=main" --jq .sha)
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/one-time-branch-cleanup.yml" -f message='Remove temporary branch cleanup workflow' -f sha="$sha" -f branch=main
