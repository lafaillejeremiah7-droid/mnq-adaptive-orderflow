name: Python research checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m compileall -q mnq_flow tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample smoke test
        run: python -m mnq_flow sample/trades.csv --out /tmp/mnq-snapshots.jsonl
