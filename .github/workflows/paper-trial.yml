name: Solana paper trial
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
concurrency:
  group: solana-paper-ledger
  cancel-in-progress: false
jobs:
  quote-and-record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Open trial ledger
        uses: actions/checkout@v4
        with:
          ref: paper-results
          path: trial
      - name: Advance paper portfolio by one observation
        run: |
          set -eu
          test -s trial/ledger.sqlite
          python3 solana_paper.py --db trial/ledger.sqlite > trial/report.next
          mv trial/report.next trial/report.json
      - name: Save trial state
        working-directory: trial
        run: |
          set -eu
          git config user.name 'paper-desk[bot]'
          git config user.email 'paper-desk@users.noreply.github.com'
          git add ledger.sqlite report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record forward paper portfolio'
            git push origin HEAD:paper-results
          fi
