name: Solana paper trial
on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
permissions:
  contents: write
concurrency:
  group: solana-paper-ledger
  cancel-in-progress: false
jobs:
  quote-and-record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Open trial ledger
        uses: actions/checkout@v4
        with:
          ref: paper-results
          path: trial
      - name: Stream live paper trades
        run: |
          set -eu
          test -s trial/ledger.sqlite
          git -C trial config user.name 'paper-desk[bot]'
          git -C trial config user.email 'paper-desk@users.noreply.github.com'
          python3 -u live_paper.py --directory trial --seconds 3900 --publish
