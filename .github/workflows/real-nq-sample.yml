name: Study historical NQZ6 real vendor sample

on:
  push:
    branches: [feature/quant-research-workflow]
    paths: [scripts/real_nq_vendor_sample.py, .github/workflows/real-nq-sample.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pyarrow==20.0.0
      - name: Verify historical source and run research
        run: python -m scripts.real_nq_vendor_sample
      - name: Commit only aggregate research, not proprietary raw data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies/real-nq-20261109-sample/summary.json studies/real-nq-20261109-sample/report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish real historical NQ sample research findings [skip ci]'
            git push origin HEAD:feature/quant-research-workflow
          fi
