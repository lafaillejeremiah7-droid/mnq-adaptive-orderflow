name: OCaml 5 core checks

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up OCaml 5.2
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5.2'
      - name: Install Dune
        run: opam install dune -y
      - name: Build
        run: opam exec -- dune build
      - name: Test
        run: opam exec -- dune runtest

  offline-python-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run all offline Python research tests
        run: python3 -m unittest discover -s tests_py -v
      - name: Verify synthetic tournament abstains without evidence
        run: |
          python3 -m scripts.agent_tournament --history examples/ILLUSTRATIVE_mnq_labeled_setups.csv > /tmp/tournament.json
          python3 -c 'import json; r=json.load(open("/tmp/tournament.json")); assert r["status"] == "NO_VALIDATED_WINNER"'
