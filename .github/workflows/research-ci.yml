name: Quant researcher checks

on:
  push:
    branches: [feature/quant-research-workflow]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m compileall -q company tests
      - run: python -m unittest discover -s tests -v
      - run: python -m company.research_lab --help
      - run: python -m company.research_gate --help
      - run: python -m company.data_admission --help
      - run: python -m company.research_pipeline --help
