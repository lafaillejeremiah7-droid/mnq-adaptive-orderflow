name: Research code static analysis and coverage

on:
  push:
    branches: [feature/quant-research-workflow]
    paths:
      - company/**
      - scripts/**
      - tests/**
      - quantlab.py
      - audit.py
      - researcher.py
      - range_study.py
      - .github/workflows/static-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned static analysis and coverage tools
        run: python -m pip install ruff==0.14.6 coverage==7.11.3
      - name: Static check for undefined names, unused code and bug patterns
        run: ruff check company benchmarks scripts examples quantlab.py range_study.py researcher.py audit.py tests --select F,E9,B --output-format concise
      - name: Full repository unit tests with branch coverage
        run: |
          coverage run --branch --source=company,quantlab,range_study,audit,researcher,scripts -m unittest discover -s tests -v
          coverage report -m
