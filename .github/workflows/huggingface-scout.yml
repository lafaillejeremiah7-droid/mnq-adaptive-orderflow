name: Hugging Face NQ/MNQ dataset discovery

on:
  push:
    branches: [feature/quant-research-workflow]
    paths:
      - company/huggingface_discovery.py
      - .github/workflows/huggingface-scout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test HF discovery validation and classification
        run: python -m unittest tests.test_huggingface_discovery -v
      - name: Search live Hugging Face public dataset catalog
        run: python -m company.huggingface_discovery
      - name: Publish metadata-only candidate report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies/huggingface-discovery/candidates.json studies/huggingface-discovery/report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Hugging Face data-source scouting results [skip ci]'
            git push origin HEAD:feature/quant-research-workflow
          fi
