name: Compare Python Rust Cpp NQ research hot path

on:
  push:
    branches: [feature/quant-research-workflow]
    paths:
      - benchmarks/lang_perf/**
      - tests/test_language_benchmark.py
      - .github/workflows/language-benchmark.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test deterministic benchmark reference
        run: python -m unittest tests.test_language_benchmark -v
      - name: Install historical-vendor Parquet reader
        run: python -m pip install pyarrow==20.0.0
      - name: Install Rust-backed Polars Python baseline
        run: python -m pip install polars==1.34.0
      - name: Run repeatable Python Polars Rust Cpp comparisons on two datasets
        run: python -m benchmarks.lang_perf.run --vendor --polars --rounds 5
      - name: Commit only aggregate timing and correctness report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add studies/language-benchmark/summary.json studies/language-benchmark/report.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record cross-language NQ research benchmark [skip ci]'
            git push origin HEAD:feature/quant-research-workflow
          fi
