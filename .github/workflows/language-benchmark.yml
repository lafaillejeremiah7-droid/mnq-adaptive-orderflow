name: Compare Python Rust Cpp NQ research hot path

on:
  push:
    branches: [feature/quant-research-workflow]
    paths:
      - benchmarks/lang_perf/**
      - tests/test_language_benchmark.py
      - .github/workflows/language-benchmark.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test deterministic benchmark reference
        run: python -m unittest tests.test_language_benchmark -v
      - name: Install historical-vendor Parquet reader
        run: python -m pip install pyarrow==20.0.0
      - name: Install Rust-backed Polars Python baseline
        run: python -m pip install polars==1.34.0
      - name: Run repeatable Python Polars Rust Cpp comparisons on two datasets
        run: python -m benchmarks.lang_perf.run --vendor --polars --rounds 5
      - name: Preserve immutable benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: language-benchmark-${{ github.sha }}
          path: studies/language-benchmark/
          if-no-files-found: error
          retention-days: 30
